<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社内勤務管理システム</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- ログインエリア -->
      <div id="login-section">
        <h2>社内勤務管理システム - ログイン</h2>
        <div id="login-message"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="username">ユーザー名</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" required />
          </div>
          <button type="submit">ログイン</button>
        </form>
      </div>

      <!-- ダッシュボードエリア（ログイン後） -->
      <div id="dashboard-section" class="hidden">
        <div class="header-bar">
          <h3>ようこそ、<span id="user-display-name"></span> さん</h3>
          <button id="logout-btn" style="background-color: #dc3545">
            ログアウト
          </button>
        </div>

        <!-- タブナビゲーション -->
        <div class="nav-tabs">
          <div class="nav-tab active" onclick="switchTab('tab-work-input')">
            勤務実績入力
          </div>
          <div class="nav-tab" onclick="switchTab('tab-summary')">
            集計・レポート
          </div>
          <div class="nav-tab" onclick="switchTab('tab-master')">
            マスタ管理
          </div>
        </div>

        <!-- タブ1: 勤務実績入力 -->
        <div id="tab-work-input" class="tab-content">
          <h4>日次勤務入力</h4>
          <div id="work-message"></div>
          <form id="work-record-form">
            <div class="form-group">
              <label for="work-date">日付</label>
              <input type="date" id="work-date" required />
            </div>
            <div style="display: flex; gap: 10px">
              <div class="form-group" style="flex: 1">
                <label for="start-time">出勤時間</label>
                <input type="time" id="start-time" value="08:30" required />
              </div>
              <div class="form-group" style="flex: 1">
                <label for="end-time">退勤時間</label>
                <input type="time" id="end-time" value="17:30" required />
              </div>
              <div class="form-group" style="flex: 1">
                <label for="overtime">残業時間 (時間)</label>
                <input
                  type="number"
                  id="overtime"
                  step="0.5"
                  value="0"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label for="construction-select">工事番号</label>
              <select id="construction-select" required>
                <option value="">読み込み中...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="remarks">備考</label>
              <textarea id="remarks" rows="3"></textarea>
            </div>
            <button type="submit">勤務データを登録</button>
          </form>
        </div>

        <!-- タブ2: 集計・レポート -->
        <div id="tab-summary" class="tab-content hidden">
          <h4>月間勤務集計・サマリー</h4>
          <div id="summary-message"></div>

          <div
            class="form-group"
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              margin-bottom: 20px;
            "
          >
            <label for="summary-year-month" style="margin: 0">対象年月:</label>
            <input type="month" id="summary-year-month" style="width: auto" />
            <button type="button" id="load-summary-btn" style="width: auto">
              集計表示
            </button>
            <!-- ★追加：CSV出力ボタン -->
            <button
              type="button"
              id="export-csv-btn"
              style="width: auto; background-color: #28a745; color: #fff"
            >
              CSV出力
            </button>
          </div>

          <div
            id="summary-cards"
            style="display: flex; gap: 20px; margin-bottom: 20px"
          >
            <div
              style="
                flex: 1;
                padding: 15px;
                border: 1px solid #ccc;
                border-radius: 5px;
                text-align: center;
              "
            >
              <h5>出勤日数</h5>
              <p
                style="
                  font-size: 24px;
                  font-weight: bold;
                  color: #007bff;
                  margin: 5px 0 0 0;
                "
              >
                <span id="total-work-days">0</span> 日
              </p>
            </div>
            <div
              style="
                flex: 1;
                padding: 15px;
                border: 1px solid #ccc;
                border-radius: 5px;
                text-align: center;
              "
            >
              <h5>合計残業時間</h5>
              <p
                style="
                  font-size: 24px;
                  font-weight: bold;
                  color: #dc3545;
                  margin: 5px 0 0 0;
                "
              >
                <span id="total-overtime-hours">0</span> 時間
              </p>
            </div>
          </div>

          <h5>工事別時間内訳</h5>
          <table
            style="width: 100%; border-collapse: collapse; margin-top: 10px"
          >
            <thead>
              <tr
                style="
                  background-color: #f8f9fa;
                  border-bottom: 2px solid #dee2e6;
                "
              >
                <th style="padding: 8px; text-align: left">工事コード</th>
                <th style="padding: 8px; text-align: left">工事名</th>
                <th style="padding: 8px; text-align: right">合計時間</th>
              </tr>
            </thead>
            <tbody id="construction-breakdown-body">
              <tr>
                <td colspan="3" style="padding: 8px; text-align: center">
                  対象年月を選択して集計を表示してください。
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- タブ3: マスタ管理 -->
        <div id="tab-master" class="tab-content hidden">
          <h4>工事番号・ユーザーマスタ（準備中）</h4>
          <p>工事番号の追加・編集機能を配置します。</p>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
